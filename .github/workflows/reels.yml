name: Reels worker

# Makes the website posters and the reels for Ae Haalo Gujarat's newly published stories (worker.py) and uploads
# them to https://aehaalogujarat.com, which posts them everywhere. Public repository, so GitHub Actions minutes are
# free: it runs every 30 minutes, and the website starts it too when stories wait (workflow_dispatch). The website's
# code stays private; this repository only draws posters and reels. The music tracks are not stored here: the worker
# downloads them from the website.
# Needs repository secrets SITE_URL (https://aehaalogujarat.com) and REELS_SECRET (the same value as the website's
# REELS_SECRET).
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Edition code (set by the website; informational)"
        required: false
        default: all
      site_url:
        description: "Website address (empty = the SITE_URL secret)"
        required: false
        default: ""
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: reels-${{ inputs.site_url || inputs.site || 'all' }}
  cancel-in-progress: false

jobs:
  reels:
    # pinned: the newest image (26.04) could not reach its package mirror, so ffmpeg failed to install on every run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg and fonts
        timeout-minutes: 8
        run: |
          # one quick try at Ubuntu's mirror; when it is down (it has been), carry on without it instead of failing the run
          if sudo timeout 90 apt-get update -o Acquire::http::Timeout=15 -o Acquire::Retries=1; then
            sudo timeout 240 apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji fonts-noto-core && echo "APT_OK=1" >> "$GITHUB_ENV" || echo "::warning::apt install failed; using fallbacks"
          else
            echo "::warning::Ubuntu package mirror unreachable; using fallbacks"
          fi
          # ffmpeg fallback: a static build from GitHub
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL -m 180 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
            sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          fi
          # emoji font fallback (the brand fonts ship with this repository)
          if ! fc-list | grep -qi "Noto Color Emoji"; then
            mkdir -p ~/.local/share/fonts
            curl -fsSL -m 60 -o ~/.local/share/fonts/NotoColorEmoji.ttf https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf && fc-cache -f >/dev/null || true
          fi
          ffmpeg -hide_banner -version | head -1

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          # Chromium's system libraries come from apt too; the runner image already has them, so skip that when apt is down
          if [ "$APT_OK" = 1 ]; then timeout 300 python -m playwright install --with-deps chromium || python -m playwright install chromium
          else python -m playwright install chromium; fi

      - name: Make and upload reels
        env:
          SITE_URL: ${{ inputs.site_url || secrets.SITE_URL }}
          REELS_SECRET: ${{ secrets.REELS_SECRET }}
          REELS_LIMIT: "10"
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$REELS_SECRET" ]; then
            echo "::error::Add the repository secrets SITE_URL and REELS_SECRET (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          python -u worker.py
